spring.application.name=VOLTLEDGER
spring.profiles.default=preview
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
voltledger.bootstrap.admin.username=${VL_BOOTSTRAP_ADMIN_USERNAME:admin}
voltledger.bootstrap.admin.password=${VL_BOOTSTRAP_ADMIN_PASSWORD:}

# User-facing errors must not expose server details.
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
# Local preview registration is enabled; production config overrides this default.
voltledger.registration.enabled=${VL_PUBLIC_REGISTRATION_ENABLED:true}
