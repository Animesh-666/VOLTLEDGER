# Activate as SPRING_PROFILES_ACTIVE=firebase,production ONLY behind HTTPS.
spring.thymeleaf.cache=true
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Enable on a public deployment only when ready to accept new accounts.
voltledger.registration.enabled=${VL_PUBLIC_REGISTRATION_ENABLED:false}
