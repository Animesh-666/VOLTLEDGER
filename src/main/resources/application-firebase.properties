# Activate with SPRING_PROFILES_ACTIVE=firebase
# For local development use GOOGLE_APPLICATION_CREDENTIALS pointing to a private JSON file.
# For hosted Docker use FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 (secret env var).
# Never paste credentials into this properties file or commit private keys.
voltledger.firebase.project-id=${FIREBASE_PROJECT_ID:}
voltledger.storage.mode=firestore
